# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# (AgentX.xcodeproj is git-ignored; this file is the source of truth.)
name: AgentX
options:
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  AgentXKit:
    path: AgentXKit
  # The encrypted Mac ↔ iPhone link, shared by both apps.
  RemoteKit:
    path: RemoteKit

# Channel (AgentX Dev by default, AgentX via scripts/install.sh) and signing.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

targets:
  AgentX:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist", "AgentX.entitlements"]
    dependencies:
      - package: AgentXKit
        product: AgentXKit
      - target: AgentXWidgets   # embedded in Contents/PlugIns
    settings:
      base:
        # dev.agentx.AgentX (installed) or dev.agentx.AgentX.dev (AgentX Dev); see Config/.
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentx.AgentX$(AGENTX_BUNDLE_ID_SUFFIX)
        PRODUCT_NAME: $(AGENTX_PRODUCT_NAME)
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: $(AGENTX_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(AGENTX_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(AGENTX_TEAM)
        GENERATE_INFOPLIST_FILE: NO
        # Point at our hand-written files (XcodeGen's `info:`/`entitlements:` keys would regenerate them).
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/AgentX.entitlements
        # The embed script below copies files from outside the build folder.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # Installed builds carry their own agent-core (staged by scripts/install.sh),
      # copied in before Xcode signs the app.
      - name: Embed agent-core
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "${AGENTX_EMBED_CORE_FROM}" ]; then
            echo "AgentX Dev: agent-core runs from the repo, nothing to embed."
            exit 0
          fi
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/agent-core"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          ditto --noextattr --noqtn "${AGENTX_EMBED_CORE_FROM}/src" "$DEST/src"
          cp "${AGENTX_EMBED_CORE_FROM}/package.json" "$DEST/package.json"
          ditto --noextattr --noqtn "${AGENTX_EMBED_CORE_FROM}/node_modules" "$DEST/node_modules"
          echo "Embedded agent-core from ${AGENTX_EMBED_CORE_FROM}"

  AgentXWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets
        excludes: ["Info.plist", "AgentXWidgets.entitlements"]
    dependencies:
      - package: AgentXKit
        product: AgentXShared
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentx.AgentX$(AGENTX_BUNDLE_ID_SUFFIX).Widgets
        PRODUCT_NAME: AgentXWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/AgentXWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: $(AGENTX_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(AGENTX_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(AGENTX_TEAM)
        SKIP_INSTALL: YES

  # The iPhone companion (Settings → iPhone on the Mac pairs it).
  # Build and install it on your iPhone with scripts/run-phone.sh.
  AgentXPhone:
    type: application
    platform: iOS
    sources:
      - path: Phone
        excludes: ["Info.plist"]
    dependencies:
      - package: RemoteKit
        product: AgentXRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentx.AgentX.phone
        PRODUCT_NAME: AgentXPhone
        INFOPLIST_FILE: Phone/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        # iOS needs a provisioning profile: Xcode makes one for your team (a free account works).
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: $(AGENTX_TEAM)

schemes:
  AgentX:
    build:
      targets:
        AgentX: all
    run:
      config: Debug
  AgentXPhone:
    build:
      targets:
        AgentXPhone: all
    run:
      config: Debug
